version: '3.8'

services:
  db:
    image: postgres:alpine
    container_name: erp-crm-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mini_erp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: erp-crm-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mini_erp_db?schema=public
      - JWT_SECRET=super-secret-mini-erp-crm-key-2026-docker
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: erp-crm-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres-data:
